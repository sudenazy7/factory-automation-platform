spring:
  datasource:
    url: jdbc:h2:mem:factory_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      repositories:
        enabled: false

  kafka:
    listener:
      auto-startup: false

logging:
  level:
    com.factory.automation: WARN
